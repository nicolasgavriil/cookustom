services:
  - type: web
    name: cookustom-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: starter
    buildCommand: uv sync --frozen --no-dev
    startCommand: >
      sh -c 'uv run --frozen --no-dev alembic -c alembic.ini upgrade head &&
      uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port "$PORT"'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cookustom-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: cookustom-db
    region: singapore
    databaseName: cookustom
    user: cookustom
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
