services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipe_app}
      POSTGRES_USER: ${POSTGRES_USER:-recipe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
